services:
  - type: web
    name: telespeak-cgm-dupe-checker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SPREADSHEET_ID
        sync: false
      - key: SHEET_NAME
        value: Form Responses 1
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
