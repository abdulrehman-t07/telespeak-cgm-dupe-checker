name: Keep Render App Awake

on:
  schedule:
    # Runs every 14 minutes between 12:00 and 23:59 UTC (5:00 PM - 4:59 AM PKT; covers 6 PM - 4 AM PKT shift)
    - cron: "*/14 12-23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: curl -fsS --max-time 30 https://telespeak-cgm-dupe-checker.onrender.com/api/status > /dev/null
