name: Keep Render App Awake

on:
  schedule:
    # Runs every 14 minutes between 14:00 and 21:59 UTC (7:00 PM - 2:59 AM PKT; keeps awake through 3 AM PKT)
    - cron: "*/14 14-21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: curl -fsS --max-time 30 https://telespeak-cgm-dupe-checker.onrender.com/api/status > /dev/null
